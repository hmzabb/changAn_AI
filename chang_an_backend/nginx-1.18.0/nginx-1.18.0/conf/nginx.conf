
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;
        # 指定前端项目所在的位置
        location / {
            root   html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }


        # ---- AI 服务分流（必须放在 location /api 之前：nginx 前缀最长匹配）----
        # 流式聊天直连 Python 8000，不经 Java——RestTemplate 会把响应整体缓冲，
        # SSE 打字机会变成"等几十秒一次性吐全文"；nginx 关缓冲逐帧透传
        location /api/ai/chat {
            default_type text/event-stream;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /api/ai/health {
            proxy_pass http://127.0.0.1:8000;
        }

        # 建库/状态管理接口仅本机可访问（Python 层还有 127.0.0.1 校验，双层防护）
        location /api/ai/admin/ {
            proxy_pass http://127.0.0.1:8000;
            allow 127.0.0.1;
            deny all;
        }

        location /api {
            default_type  application/json;
            #internal;  
            keepalive_timeout   30s;  
            keepalive_requests  1000;  
            #支持keep-alive  
            proxy_http_version 1.1;  
            rewrite /api(/.*) $1 break;  
            proxy_pass_request_headers on;
            #more_clear_input_headers Accept-Encoding;  
            proxy_next_upstream error timeout;  
            #proxy_pass http://127.0.0.1:8081;
            proxy_pass http://backend;
        }
    }

    upstream backend {
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
        server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    }  
}
